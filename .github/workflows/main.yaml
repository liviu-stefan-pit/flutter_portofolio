name: Build and Release
on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main
      - develop

jobs:
  flutter_test:
    name: Run flutter test and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-java@v1
        with:
          java-version: "12.x"
      - uses: subosito/flutter-action@v1
        with:
          channel: "stable"
      - run: flutter pub get
      - run: flutter analyze
      #- run: flutter test

  build_ios:
    name: Build Flutter (iOS)
    needs: [flutter_test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-java@v1
        with:
          java-version: "12.x"
      - uses: subosito/flutter-action@v1
        with:
          channel: "stable"
      - run: flutter pub get
      - run: flutter clean
      - run: flutter build ios --release --no-codesign
      - name: Release Artifacts (IOS)
        uses: actions/checkout@v2
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/ios/iphoneos/Runner.app"
          token: ${{ secrets.TOKEN }}
          name: "ShareLib-${{github.ref_name}}-ios.app"
          tag: ${{ github.ref_name }}
          prerelease: true

  build_appbundle:
    name: Build Flutter (Android)
    needs: [flutter_test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-java@v1
        with:
          java-version: "12.x"
      - uses: subosito/flutter-action@v1
        with:
          channel: "stable"
      - run: flutter pub get
      - run: flutter clean
      - run: flutter build appbundle
      - name: Release Artifacts (Android)
        uses: actions/checkout@v2
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/bundle/release/app-release.aab"
          token: ${{ secrets.TOKEN }}
          name: "ShareLib-${{github.ref_name}}-android.aab"
          tag: ${{ github.ref_name }}
          prerelease: true

  build_windows:
    name: Build Flutter (Windows)
    needs: [flutter_test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-java@v1
        with:
          java-version: "12.x"
      - uses: subosito/flutter-action@v1
        with:
          channel: "stable"
      - run: flutter pub get
      - run: flutter clean
      - run: flutter build windows --release
      - name: Release Artifacts (Windows)
        uses: actions/checkout@v2
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/windows/runner/Release/ShareLib.exe"
          token: ${{ secrets.TOKEN }}
          name: "ShareLib-${{github.ref_name}}-windows.exe"
          tag: ${{ github.ref_name }}
          prerelease: true
  
