  build_web:
    name: Build Flutter (Web)
    needs: [flutter_test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-java@v1
        with:
          java-version: "12.x"
      - uses: subosito/flutter-action@v1
        with:
          channel: "stable"
      - run: flutter pub get
      - run: flutter clean
      - run: flutter build web --release
      = name: Release Artifacts (Web)
        uses: actions/checkout@v2
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/web"
          token: ${{ secrets.TOKEN }}
          name: "ShareLib-${{github.ref_name}}-web.zip"
          tag: ${{ github.ref_name }}
          prerelease: true